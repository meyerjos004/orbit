<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a0840">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>HELIOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0d;--panel:#111116;--txt:#ecebf3;--mut:#8b8a99;--acc:#a78bfa;--acc2:#7c3aed;--red:#ff4d5e;--up:#2bd4a0;--amb:#ffc65c;--blue:#7aa7ff;--glass:rgba(14,14,20,.62);--edge:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.35 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
#stage{position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 0;pointer-events:none}
.score{pointer-events:none}
.lbl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
#dust{display:block;font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.02;text-shadow:0 2px 24px rgba(167,139,250,.35)}
.rates{display:flex;gap:6px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12px;color:var(--mut)}
.pill b{color:var(--txt);font-weight:700}.pill.g b{color:var(--up)}
.icbtn{pointer-events:auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--txt);cursor:pointer}
.icbtn:active{transform:scale(.96)}
#frenzy{position:absolute;top:calc(118px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:rgba(255,198,92,.14);border:1px solid rgba(255,198,92,.5);color:var(--amb);font-size:12px;font-weight:700;backdrop-filter:blur(14px);animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 24px rgba(255,198,92,.45)}}
#hint{position:absolute;left:50%;top:58%;transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);color:var(--txt);font-size:12px;font-weight:600;pointer-events:none;transition:opacity .6s;animation:bob 1.6s ease-in-out infinite}
#hint.gone{opacity:0}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
#floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;transform:translate(-50%,0);font-weight:800;font-size:15px;color:#fff;text-shadow:0 0 12px rgba(255,220,160,.8);animation:up 1.1s cubic-bezier(.2,.7,.3,1) forwards;white-space:nowrap}
.float.big{font-size:20px;color:var(--amb)}
@keyframes up{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}
/* SHEET */
#sheet{position:relative;background:linear-gradient(180deg,rgba(17,17,22,.86),rgba(12,12,16,.96));border-top:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;height:44vh;padding-bottom:env(safe-area-inset-bottom)}
#sheet::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,.6),transparent)}
#tabs{display:flex;gap:6px;padding:12px 12px 8px;align-items:center}
.tab{flex:0 0 auto;background:transparent;border:1px solid var(--edge);color:var(--mut);border-radius:999px;padding:7px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;position:relative;transition:all .2s}
.tab.on{color:var(--txt);border-color:var(--acc);background:rgba(167,139,250,.18)}
.tab.new::after{content:"";position:absolute;top:2px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
#buymode{margin-left:auto;min-width:52px}
#list{flex:1;overflow-y:auto;padding:4px 12px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.row{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 12px;margin-bottom:8px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--edge);cursor:pointer;transition:transform .15s,border-color .2s,background .2s,opacity .2s}
.row.ok{border-color:rgba(167,139,250,.32);background:linear-gradient(90deg,rgba(167,139,250,.08),rgba(255,255,255,.02))}
.row.ok:hover{border-color:rgba(167,139,250,.6)}
.row:active{transform:scale(.98)}
.row.no{opacity:.55}.row.locked{opacity:.35;cursor:default}
.row.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.row:focus-visible,.tab:focus-visible,.icbtn:focus-visible,.cta:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mid{display:flex;flex-direction:column;min-width:0}
.nm{font-weight:700;font-size:14px}.ds{font-size:12px;color:var(--mut);margin-top:1px}
.ms{font-size:10px;color:var(--mut);margin-top:3px;letter-spacing:.02em}
.bar{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.07);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:2px;transition:width .3s}
.rt{display:flex;flex-direction:column;align-items:flex-end}
.cost{font-weight:800;font-size:14px;display:flex;align-items:center;gap:5px}.cost::before{content:"";width:9px;height:9px;transform:rotate(45deg);background:linear-gradient(135deg,#fff,var(--acc));border-radius:2px;box-shadow:0 0 6px var(--acc)}
.row.no .cost{color:var(--mut)}
.own{font-size:11px;color:var(--mut);margin-top:2px}
/* mini planet icons */
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 50% 120%,rgba(167,139,250,.18),rgba(255,255,255,.02) 70%);border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden;font-weight:800;color:var(--mut)}
.ico::before{content:"";position:absolute;border-radius:50%}
.ico.emo{font-size:22px}
.ico-mote::before{width:5px;height:5px;background:#fff;box-shadow:10px -8px 0 -1px #ffe9c8,-12px 6px 0 -1px #ffe9c8,6px 12px 0 -2px #fff,-8px -10px 0 -2px #fff,0 0 10px 3px rgba(255,233,200,.8)}
.ico-rock::before{width:20px;height:16px;border-radius:40% 55% 45% 60%;background:radial-gradient(circle at 35% 30%,#bdb3aa,#6d635c 70%);box-shadow:14px 10px 0 -5px #8a7f78,-13px -9px 0 -6px #8a7f78}
.ico-moon::before{width:26px;height:26px;background:radial-gradient(circle at 30% 30%,#f2f1f6,#9b98a3 60%,#4a4850);box-shadow:inset -3px -2px 0 rgba(0,0,0,.25)}
.ico-plan::before{width:28px;height:28px;background:radial-gradient(circle at 70% 60%,#4f7d3a 0 18%,transparent 19%),radial-gradient(circle at 30% 35%,#c9b48a 0 14%,transparent 15%),radial-gradient(circle at 32% 30%,#7cc0ff,#1a5fa8 60%,#082a50);box-shadow:0 0 12px rgba(111,183,255,.55)}
.ico-giant::before{width:30px;height:30px;background:repeating-linear-gradient(170deg,#e8c49a 0 4px,#a8643a 4px 7px,#fff1d6 7px 9px);box-shadow:inset -6px -4px 10px rgba(0,0,0,.45)}
.ico-giant::after{content:"";position:absolute;width:46px;height:12px;border-radius:50%;border:2px solid rgba(255,241,214,.7);transform:rotate(-18deg)}
.ico-ring::before{width:34px;height:34px;border:4px solid #d9d4ef;box-shadow:0 0 10px rgba(167,139,250,.8),inset 0 0 8px rgba(167,139,250,.6);transform:rotateX(62deg)}
.ico-dyson::before{width:14px;height:14px;background:#fff6d9;box-shadow:0 0 12px 4px #ffcf6a,12px 0 0 -4px #2bd4a0,-12px 0 0 -4px #2bd4a0,0 12px 0 -4px #2bd4a0,0 -12px 0 -4px #2bd4a0,9px 9px 0 -4px #2bd4a0,-9px -9px 0 -4px #2bd4a0,9px -9px 0 -4px #2bd4a0,-9px 9px 0 -4px #2bd4a0}
.ico-pulsar::before{width:12px;height:12px;background:#e6f0ff;box-shadow:0 0 14px 5px #7aa7ff}
.ico-pulsar::after{content:"";position:absolute;width:4px;height:52px;background:linear-gradient(180deg,transparent,rgba(159,195,255,.7),transparent);transform:rotate(28deg)}
.ico-hole::before{width:16px;height:16px;background:#000;box-shadow:0 0 0 2px #ffb08a,0 0 14px 4px #ff4d5e}
.ico-hole::after{content:"";position:absolute;width:42px;height:10px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,200,150,.9),rgba(255,77,94,.4) 55%,transparent 70%);transform:rotate(-14deg);z-index:-1}
.card{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--edge);margin-bottom:8px}
.big{font-size:30px;font-weight:800}.big.up{color:var(--up)}
.cta{all:unset;box-sizing:border-box;text-align:center;width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--acc);background:rgba(167,139,250,.2);font-weight:700;cursor:pointer}
.cta.red{border-color:var(--red);background:linear-gradient(180deg,rgba(255,77,94,.28),rgba(255,77,94,.12))}
.cta:disabled{opacity:.35;cursor:default}.cta.ghost{border-color:var(--edge);background:transparent;color:var(--mut);font-weight:600}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}.kv span{color:var(--mut)}
.achs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ach{padding:6px 10px;border-radius:999px;border:1px solid var(--edge);font-size:12px;color:var(--mut)}
.ach.got{color:var(--txt);border-color:rgba(43,212,160,.5);background:rgba(43,212,160,.10)}
.empty{color:var(--mut);font-size:12px;margin:6px 4px}
#toast{position:fixed;left:50%;top:calc(126px + env(safe-area-inset-top));transform:translate(-50%,-8px);opacity:0;padding:9px 14px;border-radius:12px;background:rgba(17,17,22,.9);border:1px solid rgba(167,139,250,.4);backdrop-filter:blur(14px);font-size:13px;font-weight:600;transition:all .3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#zoombar{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
#zoombar .icbtn{font-size:20px;font-weight:600}#zoombar .icbtn.sm{width:32px;height:32px;font-size:15px;border-radius:10px}
#zlvl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:4px 0}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.syslbl{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;padding:5px 10px;border-radius:10px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);white-space:nowrap;opacity:0;transition:opacity .3s}
.syslbl b{font-size:12px}.syslbl span{font-size:10px;color:var(--mut)}.syslbl.home{border-color:rgba(167,139,250,.6)}.syslbl.home span{color:var(--acc)}
@media (min-width:900px){
  #app{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) 400px}
  #sheet{height:auto;min-height:0;border-top:0;border-left:1px solid var(--edge)}
  #sheet::before{left:-1px;right:auto;top:0;bottom:0;width:1px;height:auto;background:linear-gradient(180deg,transparent,rgba(167,139,250,.6),transparent)}
  #dust{font-size:48px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* KING_CINE */
#app.cine #sheet,#app.cine #hud,#app.cine #hint,#app.cine #toast,#app.cine #zlvl,#app.cine #zin,#app.cine #zout,#app.cine #zhome{display:none!important}
#app.cine{grid-template-rows:minmax(0,1fr)!important;grid-template-columns:minmax(0,1fr)!important}
#app.cine #cine{opacity:.35}#app.cine #cine:hover{opacity:1}

/* KING_RAIL: phone quick-buy rail */
#rail{display:none}
@media (max-width:899px){
#rail{position:absolute;z-index:4;left:calc(8px + env(safe-area-inset-left));top:calc(112px + env(safe-area-inset-top));bottom:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-width:none;padding:2px 2px 8px;-webkit-mask-image:linear-gradient(180deg,#000 85%,transparent);mask-image:linear-gradient(180deg,#000 85%,transparent)}
#rail::-webkit-scrollbar{display:none}
.rb{all:unset;position:relative;box-sizing:border-box;width:44px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rb .ico{width:40px;height:40px;border-radius:12px;background:rgba(10,10,16,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);transition:transform .12s,border-color .2s,opacity .2s}
.rb .ico::before{transform:scale(.78)}
.rb i{font:600 10px/1 Inter,system-ui,sans-serif;font-style:normal;font-variant-numeric:tabular-nums;color:var(--mut,#8b8a99)}
.rb b{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:#ecebf3;color:#0a0a0d;font:700 10px/16px Inter,system-ui,sans-serif;text-align:center;font-variant-numeric:tabular-nums}
.rb.ok .ico{border-color:rgba(43,212,160,.55)} .rb.ok i{color:#2bd4a0}
.rb.no .ico{opacity:.6}
.rb.lock{opacity:.32;cursor:default} .rb.lock .ico{font:600 15px Inter,system-ui,sans-serif;color:#ecebf3}
.rb:active .ico{transform:scale(.92)}
.rb.pop .ico{animation:rbpop .32s cubic-bezier(.2,.9,.25,1.4)} @keyframes rbpop{40%{transform:scale(1.14)}}
.rb.shake .ico{animation:rbshake .28s} @keyframes rbshake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.rb:focus-visible .ico{outline:2px solid #a78bfa;outline-offset:2px}
}
@media (prefers-reduced-motion:reduce){.rb .ico{animation:none!important;transition:none}}

/* KING_TAPMODE */
#modesw{position:absolute;z-index:5;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;padding:3px;border-radius:999px;background:rgba(10,10,16,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08)}
#modesw button{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;color:var(--mut,#8b8a99);font:600 12px/1 Inter,system-ui,sans-serif;transition:background .2s,color .2s;-webkit-tap-highlight-color:transparent}
#modesw button.on{background:rgba(255,255,255,.12);color:#ecebf3}
#modesw button:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}
.tapmode #zoombar,.tapmode #labels,.tapmode #hint{opacity:0;pointer-events:none;transition:opacity .3s}
.cine #modesw{display:none}
@media (min-width:900px){#modesw{top:16px}}

/* KING_TAPVIEW */
#tapv{position:absolute;inset:0;z-index:1;width:100%;height:100%;display:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
.tapmode #tapv{display:block}
.tapmode #cv{visibility:hidden}
#hud,#floats{z-index:3}
#rail{z-index:4}
#modesw{z-index:6}

/* ===== KING_PIXEL: HELIOS neon arcade theme (overrides everything above) ===== */
:root{--bg:#1a0840;--panel:#22105a;--txt:#fff6ff;--mut:#c9a8ff;--acc:#00f0ff;--acc2:#ff2ea6;--red:#ff2e6e;--up:#7dff3a;--amb:#ffe600;--blue:#2d7bff;--glass:#2a1468;--edge:#5a2ab8;--ink:#0a0320}
html,body{background:#1a0840;font-family:"Pixelify Sans",ui-monospace,monospace;letter-spacing:.01em}
button,input{font-family:inherit}
#cv{visibility:hidden}#tapv{display:block!important;z-index:1;image-rendering:pixelated;image-rendering:crisp-edges}
#zoombar,#cine,#labels{display:none!important}
.lbl{color:var(--acc);letter-spacing:.14em;font-weight:600;text-shadow:2px 2px 0 var(--ink)}
#dust{font-weight:700;font-size:44px;letter-spacing:0;color:#fff;text-shadow:3px 3px 0 var(--acc2),6px 6px 0 var(--ink)}
.pill,.icbtn,#modesw,#hint,#frenzy{border-radius:0!important;background:var(--glass)!important;border:2px solid var(--edge)!important;box-shadow:3px 3px 0 var(--ink);backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.pill.g b{color:var(--up)}.pill b{color:#fff}
#modesw{padding:3px}#modesw button{border-radius:0!important;font:600 13px "Pixelify Sans",monospace!important;color:var(--mut)!important}
#modesw button.on{background:var(--acc)!important;color:var(--ink)!important}
#frenzy{color:var(--amb)!important;border-color:var(--amb)!important}
.float{font-weight:700;font-size:16px;color:#fff;text-shadow:2px 2px 0 var(--acc2),3px 3px 0 var(--ink)!important}.float.big{color:var(--amb);font-size:22px}
#sheet{background:#1d0b4a!important;border-top:3px solid var(--acc2)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#sheet::before{display:none}
.tab{border-radius:0!important;border:2px solid var(--edge)!important;color:var(--mut)!important;font-weight:600;box-shadow:2px 2px 0 var(--ink)}
.tab.on{background:var(--acc)!important;color:var(--ink)!important;border-color:var(--acc)!important}
.tab.new::after{border-radius:0;background:var(--up);box-shadow:none}
.row{border-radius:0!important;background:#2a1468!important;border:2px solid #3e1f8f!important;box-shadow:3px 3px 0 var(--ink)}
.row.ok{border-color:var(--acc)!important;background:linear-gradient(90deg,#123a7a,#2a1468)!important}
.row.ok:hover{border-color:#9ff8ff!important}
.row:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.nm{font-weight:600;font-size:15px}.ds,.own,.ms{color:var(--mut)}
.bar{border-radius:0;background:#3e1f8f;height:4px}.bar i{border-radius:0;background:repeating-linear-gradient(90deg,var(--acc2) 0 4px,var(--amb) 4px 8px)!important}
.cost{font-weight:700;color:var(--amb)}.cost::before{border-radius:0;transform:none;width:8px;height:8px;background:var(--acc);box-shadow:2px 2px 0 var(--ink)}
.row.no .cost{color:var(--mut)}
.ico{border-radius:0!important;background:#14063a center/contain no-repeat!important;border:2px solid #3e1f8f!important;image-rendering:pixelated;box-shadow:inset 0 0 0 2px #1d0b4a}
.ico::before,.ico::after{display:none!important}
.card{border-radius:0!important;background:#2a1468!important;border:2px solid var(--edge)!important;box-shadow:3px 3px 0 var(--ink)}
.big{font-weight:700}.big.up{color:var(--up)}
.cta{border-radius:0!important;border:2px solid var(--ink)!important;background:var(--acc)!important;color:var(--ink)!important;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
.cta:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.cta.red{background:var(--acc2)!important;color:#fff!important}.cta.ghost{background:transparent!important;color:var(--mut)!important;border-color:var(--edge)!important}
.kv{border-bottom:2px dotted #3e1f8f}
.ach{border-radius:0!important;border:2px solid var(--edge)!important}.ach.got{border-color:var(--up)!important;background:#1d4a3a!important;color:#fff}
#toast{border-radius:0!important;background:var(--glass)!important;border:2px solid var(--acc)!important;box-shadow:3px 3px 0 var(--ink);font-weight:600}
#rail .rb{border-radius:0!important;background:#14063a!important;border:2px solid #3e1f8f!important;box-shadow:2px 2px 0 var(--ink)}
#rail .rb.ok{border-color:var(--up)!important}#rail .rb b{border-radius:0!important}
#rail .rb .ico{border:0!important;box-shadow:none;background-color:transparent!important}
.sheet-grip,#sheet .grip{border-radius:0!important}
@media (prefers-reduced-motion:reduce){.row:active,.cta:active{transform:none}}

/* KING_HOWTO: one-time "update your home-screen app" card */
#howto{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(10,3,32,.72)}
#howto .hc{width:min(360px,100%);background:#22105a;border:3px solid var(--acc);box-shadow:6px 6px 0 var(--ink);padding:18px 18px 16px;color:var(--txt);animation:hpop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes hpop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
#howto h2{margin:0 0 4px;font:700 22px "Pixelify Sans",monospace;color:#fff;text-shadow:2px 2px 0 var(--acc2)}
#howto p{margin:0 0 12px;color:var(--mut);font-size:14px}
#howto ol{margin:0 0 14px;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px}
#howto li::marker{color:var(--amb);font-weight:700}
#howto a{display:block;margin-top:6px;padding:10px 12px;background:#14063a;border:2px dashed var(--amb);color:var(--amb);font-weight:700;text-decoration:none;word-break:break-all;-webkit-touch-callout:default}
#howto b{color:#fff}
#howto img{width:56px;height:56px;image-rendering:pixelated;float:right;margin:0 0 6px 10px;border:2px solid var(--ink)}
@media (prefers-reduced-motion:reduce){#howto .hc{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" aria-label="Your star system. Tap the star to collect stardust. Drag to turn the view."></canvas>
    <div id="labels"></div><div id="floats"></div>
    <div id="zoombar" role="group" aria-label="Zoom"><button class="icbtn" id="zin" aria-label="Zoom in">+</button><span id="zlvl">Your system</span><button class="icbtn" id="zout" aria-label="Zoom out">−</button><button class="icbtn sm" id="zhome" aria-label="Back to your star">⌖</button><button class="icbtn sm" id="cine" aria-label="Cinema mode" title="Cinema mode">🎬</button></div>
    <div id="hud">
      <div class="score"><span class="lbl">Stardust</span><span id="dust">0</span>
        <div class="rates"><span class="pill g"><b id="ps">0</b>/sec</span><span class="pill"><b id="tv">1</b>/tap</span></div></div>
      <button class="icbtn" id="snd" aria-label="Sound on or off" aria-pressed="true"></button>
    </div>
    <div id="frenzy" hidden></div>
    <div id="hint">Tap the star · drag to look · pinch or scroll to zoom</div>
  </div>
  <div id="sheet">
    <div id="tabs" role="tablist">
      <button class="tab on" data-t="build" role="tab">Build</button>
      <button class="tab" data-t="up" id="t-up" role="tab">Upgrades</button>
      <button class="tab" data-t="nova" id="t-nova" role="tab">Supernova</button>
      <button class="tab" data-t="stats" role="tab">Stats</button>
      <button class="tab" id="buymode" aria-label="Buy amount">×1</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="cloud.js?v=794576"></script>
<script src="app.js?v=794576"></script>
<script src="sheet.js?v=794576"></script>
<script>/* KING_HOWTO: shown once per device after the HELIOS redesign */
(function () { try { if (localStorage.getItem("helios.howto") || !localStorage.getItem("kairos.orbit.v2")) return; } catch (e) { return; }
  var u = location.origin + location.pathname, d = document.createElement("div"); d.id = "howto"; d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); d.setAttribute("aria-labelledby", "howto-h");
  d.innerHTML = '<div class="hc"><img src="icon-180.png" alt=""><h2 id="howto-h">HELIOS got a new look</h2><p>Put the new app on your home screen:</p><ol>' +
    '<li>In Safari, <b>hold down</b> on this link:<a href="' + u + '">' + u.replace(/^https?:\/\//, "") + '</a></li><li>Tap <b>Share</b></li><li>Scroll down, tap <b>Add to Home Screen</b></li><li><b>Delete the old app</b> from your home screen</li></ol>' +
    '<button class="cta" id="howto-ok">Got it</button></div>';
  document.body.appendChild(d); var done = function () { try { localStorage.setItem("helios.howto", "1"); } catch (e) {} d.remove(); window.dispatchEvent(new Event("helios-howto-done")); };
  document.getElementById("howto-ok").onclick = done; d.addEventListener("keydown", function (e) { if (e.key === "Escape") done(); }); setTimeout(function () { document.getElementById("howto-ok").focus(); }, 50); })();
</script>
</body>
</html>
