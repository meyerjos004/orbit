<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NYX</title><meta name="theme-color" content="#05010f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="../kv.js"></script><script src="../kvgame.js"></script>
<style>#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;background:#05010f}
#wrap{position:relative;flex:1;min-height:0;width:100%;display:grid;place-items:center}
#cv{display:block;image-rendering:pixelated;touch-action:none;border:2px solid #2a1550;box-shadow:0 0 30px rgba(77,243,255,.15)}
#ov{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}#ov>div{pointer-events:auto;text-align:center;padding:18px 20px;background:rgba(10,4,30,.92);border:2px solid #4df3ff;box-shadow:4px 4px 0 #000;max-width:300px}
#ov h2{margin:0 0 6px;font-size:22px;color:#4df3ff;letter-spacing:.08em}#ov p{margin:6px 0;color:#c9c4e8;font-size:14px}
#ov button{all:unset;cursor:pointer;margin-top:10px;padding:11px 20px;background:#4df3ff;color:#05010f;font-weight:700;box-shadow:3px 3px 0 #000}
#pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:4px}#pad button{all:unset;cursor:pointer;display:grid;place-items:center;background:#12062e;border:2px solid #2a1550;font-size:18px;touch-action:manipulation}
#pad button:active{background:#2a1550}#pad .u{grid-column:2}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
@media(min-width:900px){#pad{display:none}}</style>
</head><body>
<div id="app">
  <div id="top"><div class="row1"><div><div class="ttl">NYX · ENERGY</div><div class="big" id="cur">0</div><div class="rate" id="rate"></div></div><div class="btns"><button class="ib" id="snd"></button><span id="kvb"></span></div></div>
    <div id="goal"><div class="gl"><span id="gtxt"></span><b id="gpct"></b></div><div class="bar"><i id="gbar"></i></div><div class="nx" id="gnext"></div></div></div>
  <div id="stage"><div id="wrap"><canvas id="cv" aria-label="The grid"></canvas><div id="ov"></div></div>
    <div id="pad" aria-label="Steer"><button class="u" data-d="0" aria-label="Up">▲</button><button class="l" data-d="3" aria-label="Left">◀</button><button class="d" data-d="2" aria-label="Down">▼</button><button class="r" data-d="1" aria-label="Right">▶</button></div></div>
  <div id="shop"></div>
</div>
<script>
/* NYX — steer a light trail out of your zone and back in to claim the grid. Clear 10 sectors. KINGVERSE game 4. */
KG.boot({ bg: "#05010f", acc: "#4df3ff", acc2: "#ff4dd8", glow: "rgba(77,243,255,.55)", line: "#2a1550" });
var OK = KV.mount("nyx", document.getElementById("kvb"));
KG.muteBtn(document.getElementById("snd"));
var S = KG.store("kv.nyx", { en: 0, sector: 1, cleared: 0, best: 0, lv: { shield: 0, zone: 0, gen: 0, jam: 0 }, relic: false, t: Date.now() });
var UP = {
  shield: { e: "🛡️", n: "Shield", d: "Survive one crash per run", base: 40, k: 3.2, max: 3 },
  zone: { e: "🟦", n: "Bigger start zone", d: "Start each run with more land", base: 25, k: 2.4, max: 4 },
  gen: { e: "🔋", n: "Grid generator", d: "Earn energy between runs", base: 15, k: 1.7, max: 25 },
  jam: { e: "📡", n: "Rider jammer", d: "Enemy riders move 8% slower", base: 60, k: 2.6, max: 5 }
};
var RELIC = { at: 6, cost: 4000 };
var B = KV.boost();
function cost(id) { var u = UP[id]; return Math.ceil(u.base * Math.pow(u.k, S.lv[id]) * B.cost); }
function rate() { return S.cleared * (0.4 + S.lv.gen * 0.35) * B.earn * B.speed; }
function target(s) { return Math.min(0.66, 0.36 + s * 0.03); }
KG.away(S, rate(), function (v) { S.en += v; });

var GW = 24, GH = 30, own, trail, P, AI, run = null, cell = 10;
var cv = document.getElementById("cv"), cx = cv.getContext("2d"), wrap = document.getElementById("wrap"), ov = document.getElementById("ov");
function fit() { var r = wrap.getBoundingClientRect(); cell = Math.max(6, Math.floor(Math.min((r.width - 8) / GW, (r.height - 8) / GH))); cv.width = GW * cell; cv.height = GH * cell; cv.style.width = GW * cell + "px"; cv.style.height = GH * cell + "px"; }
window.addEventListener("resize", fit);
var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
function I(x, y) { return y * GW + x; }
function newRun() {
  own = new Uint8Array(GW * GH); trail = new Uint8Array(GW * GH);
  var rr = 2 + S.lv.zone, cx0 = GW >> 1, cy0 = GH - 6;
  for (var y = cy0 - rr; y <= cy0 + rr; y++) for (var x = cx0 - rr; x <= cx0 + rr; x++) if (x >= 0 && y >= 0 && x < GW && y < GH) own[I(x, y)] = 1;
  P = { x: cx0, y: cy0, d: 0, nd: 0, path: [] }; AI = [];
  var n = Math.min(6, 1 + Math.floor(S.sector / 2));
  for (var k = 0; k < n; k++) AI.push({ x: 2 + Math.floor(Math.random() * (GW - 4)), y: 2 + Math.floor(Math.random() * 8), d: Math.floor(Math.random() * 4), tail: [], alive: true, c: ["#ff4dd8", "#ff9a3d", "#ffe14d"][k % 3] });
  run = { shields: S.lv.shield, acc: 0, aacc: 0, step: 0.13, astep: Math.max(0.09, (0.2 - S.sector * 0.009)) / Math.pow(0.92, S.lv.jam), earned: 0, over: false, claimed: frac() };
}
function frac() { var n = 0; for (var i = 0; i < own.length; i++) n += own[i]; return n / own.length; }
function turn(d) { if (!run || run.over) return; if ((d + 2) % 4 === P.d && P.path.length) return; P.nd = d; }
document.addEventListener("keydown", function (e) { var m = { ArrowUp: 0, w: 0, ArrowRight: 1, d: 1, ArrowDown: 2, s: 2, ArrowLeft: 3, a: 3 }[e.key]; if (m != null) { e.preventDefault(); turn(m); } if ((e.key === " " || e.key === "Enter") && (!run || run.over)) start(); });
document.getElementById("pad").addEventListener("pointerdown", function (e) { var b = e.target.closest("[data-d]"); if (b) { e.preventDefault(); turn(+b.dataset.d); } });
var sw = null; cv.addEventListener("pointerdown", function (e) { sw = [e.clientX, e.clientY]; });
cv.addEventListener("pointermove", function (e) { if (!sw) return; var dx = e.clientX - sw[0], dy = e.clientY - sw[1]; if (Math.max(Math.abs(dx), Math.abs(dy)) > 18) { turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0)); sw = [e.clientX, e.clientY]; } });
cv.addEventListener("pointerup", function () { sw = null; });
function crash(why) {
  if (run.shields > 0) { run.shields--; KV.toast("🛡️ Shield saved you (" + run.shields + " left)"); KG.tone(220, 0.2, "square", 0.04, 1.5); P.path.forEach(function (i) { trail[i] = 0; }); P.path = []; var b = nearestOwn(); P.x = b[0]; P.y = b[1]; return; }
  run.over = true; var got = Math.round(run.claimed * 100 * S.sector * 0.6 * B.earn); S.en += got; run.earned += got; KG.tone(90, 0.5, "sawtooth", 0.05, 0.4); S.save();
  showOv("<h2>CRASHED</h2><p>" + why + "</p><p>Claimed " + Math.round(run.claimed * 100) + "% of sector " + S.sector + " · +" + KG.fmt(got) + " energy</p><button id='go'>Try again</button>");
}
function nearestOwn() { var best = null, bd = 1e9; for (var y = 0; y < GH; y++) for (var x = 0; x < GW; x++) if (own[I(x, y)]) { var d = Math.abs(x - P.x) + Math.abs(y - P.y); if (d < bd) { bd = d; best = [x, y]; } } return best || [GW >> 1, GH - 6]; }
function claim() {
  P.path.forEach(function (i) { own[i] = 1; trail[i] = 0; }); var got = P.path.length; P.path = [];
  var seen = new Uint8Array(GW * GH), q = [];
  for (var x = 0; x < GW; x++) { q.push(I(x, 0), I(x, GH - 1)); } for (var y = 0; y < GH; y++) { q.push(I(0, y), I(GW - 1, y)); }
  while (q.length) { var i = q.pop(); if (seen[i] || own[i]) continue; seen[i] = 1; var cx1 = i % GW, cy1 = (i / GW) | 0; if (cx1 > 0) q.push(i - 1); if (cx1 < GW - 1) q.push(i + 1); if (cy1 > 0) q.push(i - GW); if (cy1 < GH - 1) q.push(i + GW); }
  for (var j = 0; j < own.length; j++) if (!own[j] && !seen[j]) { own[j] = 1; got++; }
  AI.forEach(function (a) { if (a.alive && own[I(a.x, a.y)] && Math.random() < 0.0) a.alive = false; });
  var e = got * 0.12 * S.sector * B.tap * B.earn; S.en += e; run.earned += e; run.claimed = frac();
  KG.tone(520 + Math.min(600, got * 6), 0.18, "triangle", 0.05, 1.3);
  if (run.claimed >= target(S.sector)) win();
}
function win() {
  run.over = true; var bonus = Math.round(20 * Math.pow(S.sector, 1.6) * B.earn); S.en += bonus;
  var first = S.sector > S.cleared; if (first) { S.cleared = S.sector; KV.setPct("nyx", S.cleared / 10); }
  KG.tone(1046, 0.4, "triangle", 0.05, 1.5);
  var done = S.cleared >= 10;
  showOv("<h2>SECTOR " + S.sector + " CLEAR</h2><p>+" + KG.fmt(bonus) + " energy" + (first ? " · new sector unlocked" : "") + "</p>" + (done ? "<p>You cleared all 10 sectors. NYX complete!</p>" : "") + "<button id='go'>" + (done ? "Play sector 10 again" : "Sector " + Math.min(10, S.sector + 1) + " ▶") + "</button>");
  if (S.sector < 10) S.sector++; S.save();
}
function showOv(h) { ov.innerHTML = "<div>" + h + "</div>"; var g = document.getElementById("go"); if (g) { g.onclick = start; g.focus(); } }
function start() { if (!OK) return; ov.innerHTML = ""; newRun(); }
function stepP() {
  if (P.nd !== P.d && !((P.nd + 2) % 4 === P.d && P.path.length)) P.d = P.nd;
  var nx = P.x + DX[P.d], ny = P.y + DY[P.d];
  if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) return crash("You hit the edge of the grid.");
  var i = I(nx, ny); if (trail[i]) return crash("You crossed your own trail.");
  P.x = nx; P.y = ny;
  for (var k = 0; k < AI.length; k++) if (AI[k].alive && AI[k].x === nx && AI[k].y === ny) { AI[k].alive = false; var e = 30 * S.sector * B.earn; S.en += e; KV.toast("💥 Rider down · +" + KG.fmt(e)); }
  if (own[i]) { if (P.path.length) claim(); } else { trail[i] = 1; P.path.push(i); }
}
function stepAI(a) {
  if (!a.alive) return; if (Math.random() < 0.18) a.d = (a.d + (Math.random() < 0.5 ? 1 : 3)) % 4;
  // hunt: sometimes steer toward the player's trail
  if (P.path.length && Math.random() < 0.25) { var t = P.path[Math.floor(Math.random() * P.path.length)], tx = t % GW, ty = (t / GW) | 0; a.d = Math.abs(tx - a.x) > Math.abs(ty - a.y) ? (tx > a.x ? 1 : 3) : (ty > a.y ? 2 : 0); }
  for (var tries = 0; tries < 4; tries++) { var nx = a.x + DX[a.d], ny = a.y + DY[a.d]; if (nx >= 0 && ny >= 0 && nx < GW && ny < GH) break; a.d = (a.d + 1) % 4; }
  a.tail.push([a.x, a.y]); if (a.tail.length > 4) a.tail.shift(); a.x += DX[a.d]; a.y += DY[a.d];
  if (trail[I(a.x, a.y)]) crash("A rider cut your trail.");
  else if (a.x === P.x && a.y === P.y && !own[I(P.x, P.y)]) crash("A rider hit you head-on.");
}
var last = performance.now();
function frame(t) {
  var dt = Math.min(0.1, (t - last) / 1000); last = t; if (OK) S.en += rate() * dt;
  if (run && !run.over) { run.acc += dt; run.aacc += dt; while (run.acc >= run.step && !run.over) { run.acc -= run.step; stepP(); } while (run.aacc >= run.astep && !run.over) { run.aacc -= run.astep; AI.forEach(stepAI); } }
  draw(t / 1000); ui(); requestAnimationFrame(frame);
}
function draw(T) {
  var c = cell; cx.fillStyle = "#05010f"; cx.fillRect(0, 0, cv.width, cv.height);
  cx.fillStyle = "rgba(167,139,250,.08)"; for (var x = 0; x <= GW; x++) cx.fillRect(x * c, 0, 1, cv.height); for (var y = 0; y <= GH; y++) cx.fillRect(0, y * c, cv.width, 1);
  if (!own) return;
  for (var i = 0; i < own.length; i++) { var px = (i % GW) * c, py = ((i / GW) | 0) * c; if (own[i]) { cx.fillStyle = "rgba(77,243,255,.22)"; cx.fillRect(px + 1, py + 1, c - 1, c - 1); } if (trail[i]) { cx.fillStyle = "#4df3ff"; cx.fillRect(px + c * 0.25, py + c * 0.25, c * 0.5, c * 0.5); } }
  AI.forEach(function (a) { if (!a.alive) return; a.tail.forEach(function (p, k) { cx.globalAlpha = (k + 1) / 6; cx.fillStyle = a.c; cx.fillRect(p[0] * c + c * 0.3, p[1] * c + c * 0.3, c * 0.4, c * 0.4); }); cx.globalAlpha = 1; cx.fillStyle = a.c; cx.fillRect(a.x * c + 1, a.y * c + 1, c - 2, c - 2); });
  var pulse = 0.7 + 0.3 * Math.sin(T * 10); cx.fillStyle = "rgba(255,255,255," + pulse + ")"; cx.fillRect(P.x * c, P.y * c, c, c); cx.fillStyle = "#4df3ff"; cx.fillRect(P.x * c + 2, P.y * c + 2, c - 4, c - 4);
}
var lastShop = "";
function ui() {
  document.getElementById("cur").textContent = KG.fmt(S.en);
  var live = run && !run.over;
  document.getElementById("rate").textContent = (rate() ? KG.fmt(rate()) + "/s from cleared sectors" : "Clear sectors to earn energy over time") + (live ? " · shields " + run.shields : "");
  var p = S.cleared / 10;
  document.getElementById("gtxt").textContent = live ? "Sector " + S.sector + ": claimed " + Math.round(run.claimed * 100) + "% of " + Math.round(target(S.sector) * 100) + "%" : "Sectors cleared " + S.cleared + "/10";
  document.getElementById("gpct").textContent = Math.floor(p * 100) + "%"; document.getElementById("gbar").style.width = (live ? Math.min(100, run.claimed / target(S.sector) * 100) : p * 100) + "%";
  document.getElementById("gnext").textContent = S.cleared >= 10 ? "All 10 sectors are yours. NYX complete!" : live ? "Leave your zone, draw a loop, get back in to claim it. Don't let a rider touch your trail." : "Next: clear sector " + S.sector + " (claim " + Math.round(target(S.sector) * 100) + "% of the grid)";
  var h = '<div class="sh">UPGRADES</div>';
  Object.keys(UP).forEach(function (id) { var u = UP[id], c = cost(id); h += KG.upRow({ id: id, e: u.e, n: u.n, d: u.d, cost: KG.fmt(c), lv: "Lv " + S.lv[id], ok: S.en >= c, max: S.lv[id] >= u.max }); });
  var R = KV.relicOf("nyx"); h += '<div class="sh">RELIC · BOOSTS ALL 5 GAMES</div>';
  h += S.relic ? KG.upRow({ id: "relic", e: R.e, n: R.n, d: R.d, cls: "relic", max: true }) : S.cleared >= RELIC.at ? KG.upRow({ id: "relic", e: R.e, n: R.n, d: R.d, cost: KG.fmt(RELIC.cost * B.cost), cls: "relic", ok: S.en >= RELIC.cost * B.cost }) : KG.upRow({ id: "relic", e: "❔", n: "A bright core pulses past sector 5…", d: "Clear sector " + RELIC.at + " to find it", cost: "", cls: "relic", ok: false });
  if (h !== lastShop) { document.getElementById("shop").innerHTML = h; lastShop = h; }
}
document.getElementById("shop").addEventListener("click", function (e) {
  var b = e.target.closest("[data-u]"); if (!b) return; var id = b.dataset.u;
  if (id === "relic") { var c = RELIC.cost * B.cost; if (S.relic || S.cleared < RELIC.at || S.en < c) return KG.tone(140, 0.1); S.en -= c; S.relic = true; KV.grant("nyx"); B = KV.boost(); KG.tone(1320, 0.3, "triangle", 0.05); S.save(); return; }
  var u = UP[id], c2 = cost(id); if (S.lv[id] >= u.max || S.en < c2) return KG.tone(140, 0.1);
  S.en -= c2; S.lv[id]++; KG.tone(660, 0.1, "triangle", 0.05); S.save();
});
fit(); newRun(); run.over = true;
showOv("<h2>NYX</h2><p>Sector " + S.sector + " · claim " + Math.round(target(S.sector) * 100) + "% of the grid.</p><p>Swipe or use the arrows. Leave your zone and come back to claim the loop.</p><button id='go'>Start ▶</button>");
setInterval(S.save, 10000); requestAnimationFrame(frame);
</script></body></html>
